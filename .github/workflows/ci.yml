name: Workshop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify schemas load correctly
        run: |
          python -c "from starter.schemas import DocumentType, ClaimFormExtraction; print('Schemas OK')"

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short
